name: Auto Sync Upstream

permissions:
  contents: write

on:
  schedule:
    - cron: '0 3 * * *' # Her gün gece 03:00'te otomatik çalışır
  workflow_dispatch: # İhtiyaç anında elle tetikleme imkanı verir

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with Upstream
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/cmliu/edgetunnel.git
          git fetch upstream
          git checkout main
          git merge upstream/main --ff-only || git merge upstream/main -m "Auto sync from upstream"
          git push origin main
          
